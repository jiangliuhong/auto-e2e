project:
  name: demo-app
  baseUrl: http://127.0.0.1:__PORT__
  startCommand: node server.mjs
  healthUrl: http://127.0.0.1:__PORT__/health
  startupTimeout: 10000

agent:
  implementation: __AGENT__
  provider: chatgpt-oauth
  model: default
  thinkingLevel: high

browser:
  explorer: playwright
  browser: chromium
  headless: true
  sessionProfile: admin
  timeout: 30000
  implementation: __BROWSER__

playwright:
  configFile: playwright.config.ts
  generatedDirectory: .auto-e2e/generated
  retries: 1
  workers: 1
  trace: retain-on-failure
  screenshot: only-on-failure
  video: retain-on-failure

generation:
  requireAcceptanceCriteria: true
  preferTestId: true
  allowSourceModification: false
  maxTestsPerTask: 10
  overwriteGeneratedTests: true

report:
  outputDirectory: .auto-e2e/reports
  artifactDirectory: .auto-e2e/artifacts
  formats:
    - console
    - json
    - html
    - junit
